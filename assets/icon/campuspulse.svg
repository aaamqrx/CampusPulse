  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#teal)"/>
  <polyline points="48,128 88,128 102,108 124,164 149,88 173,128 208,128" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="48" cy="128" r="12" fill="white"/><circle cx="208" cy="128" r="12" fill="white"/>
</svg>
