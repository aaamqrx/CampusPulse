name: Build preview draft
on:
  push:
    tags: ['v*-preview.*']
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Validate preview tag
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-preview\.\d+$') { throw 'Invalid preview tag.' }
          ./scripts/check-static.ps1
      - name: Install verified Inno Setup 6.7.3 in runner temporary directory
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Inno signature validation failed.' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $process = Start-Process -FilePath $setup -WindowStyle Hidden -Wait -PassThru -ArgumentList @('/PORTABLE=1','/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$compilerRoot+'"'))
          if ($process.ExitCode -ne 0) { throw 'Inno extraction failed.' }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build exact clean tag and verify delivery files
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/build.ps1 -Version $version -InnoCompilerPath $env:INNO_COMPILER -RequireCleanTag
          ./scripts/verify-release.ps1 -Version $version -Root "artifacts/$version" -ExpectedCommit $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-delivery
          path: |
            artifacts/*/installer/*.exe
            artifacts/*/installer/sha256.txt
            artifacts/*/build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-logs
          path: artifacts/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
  draft:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: preview-delivery
          path: delivery
      - name: Create immutable draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/verify-release.ps1 -Version $version -Root "delivery/$version" -ExpectedCommit $env:GITHUB_SHA
          $existing = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json | Where-Object tagName -EQ $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release state.' }
          if ($existing) { throw 'Release already exists; do not replace its attachments.' }
          $root = "delivery/$version"
          $files = @("$root/installer/CampusPulse-Setup-$version.exe", "$root/installer/sha256.txt", "$root/build-manifest.json")
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --draft --prerelease --title "CampusPulse $version" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed.' }
